# يبقي البرنامج على Render مستيقظاً (الخطة المجانية تنام بعد 15 دقيقة بدون زيارات).
# يعمل مجاناً على GitHub Actions لأن المستودع عام.
name: إبقاء البرنامج مستيقظاً

on:
  schedule:
    - cron: '*/10 * * * *'   # كل 10 دقائق
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: فتح رابط الفحص
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 60 https://rawda-app.onrender.com/health; then exit 0; fi
            sleep 20
          done
          echo "البرنامج لم يستجب" && exit 1
