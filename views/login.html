<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#145741">
<title>تسجيل الدخول — روضة نور ومكة</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="روضة نور ومكة">
<link rel="stylesheet" href="/assets/style.css">
<script src="/assets/theme.js"></script>
<style>
  body{min-height:100vh;display:grid;place-items:center;padding:16px;background:var(--palm-3) var(--login-bg) center/cover no-repeat}
  .box{background:var(--paper);border-radius:24px;padding:36px 28px;width:100%;max-width:380px}
  .crest{width:72px;height:72px;border-radius:20px;background:var(--sun);display:grid;place-items:center;font-family:var(--kufi);font-size:30px;color:var(--ink);margin-bottom:18px}
  h1{font-size:26px} p{color:var(--ink-2);margin:4px 0 24px}
  .err{color:var(--rose);font-size:14px;min-height:22px;margin-top:8px}
  .btn{width:100%;margin-top:14px;padding:12px}
</style>
</head>
<body>
  <form class="box" id="f">
    <div class="crest" aria-hidden="true">ن</div>
    <h1>روضة نور ومكة</h1>
    <p>المدير: كلمة المرور فقط. المعلمات والموظفون: اسم المستخدم وكلمة المرور.</p>
    <label class="f">اسم المستخدم <span style="color:var(--ink-2);font-weight:400">(اتركه فارغاً للمدير)</span><input id="un" autocomplete="username" autocapitalize="off" spellcheck="false"></label>
    <label class="f" style="margin-top:10px">كلمة المرور<input type="password" id="pw" autocomplete="current-password" required></label>
    <button class="btn primary" type="submit">دخول</button>
    <div class="err" id="err" role="alert"></div>
  </form>
<script>
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'); err.textContent = '';
  try {
    const r = await fetch('/api/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ username: document.getElementById('un').value, password: document.getElementById('pw').value }) });
    const d = await r.json();
    if (r.ok) location.href = '/'; else err.textContent = d.error || 'تعذر الدخول';
  } catch { err.textContent = 'لا يوجد اتصال بالخادم، حاول مرة أخرى'; }
});
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
</script>
</body>
</html>
